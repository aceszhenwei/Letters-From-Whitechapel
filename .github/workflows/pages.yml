# Publishes the game to GitHub Pages (docs/deployment.md): https://aceszhenwei.github.io/Letters-From-Whitechapel/
# On every push to master, or by hand (Actions > Deploy to GitHub Pages > Run workflow). The fast tests run first, so
# a commit that fails them is never published; then tools/site/build.js stages only what the game loads.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Uploading playtest records changes nothing on the site (docs/playtests.md): no redeployment for them alone
    paths-ignore:
      - 'research/human-playtests/**'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/site/build.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
