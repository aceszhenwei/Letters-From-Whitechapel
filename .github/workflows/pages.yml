# Publishes the game to GitHub Pages (docs/deployment.md): https://aceszhenwei.github.io/Letters-From-Whitechapel/
# - After every push to master that changes the game, called by the Tests workflow (test.yml) once the whole suite has
#   passed there, so the tests aren't run a second time here. Pushes that only change documentation or the playtest
#   collection don't redeploy: the site contains neither.
# - By hand (Actions > Deploy to GitHub Pages > Run workflow), for example after setting PLAYTEST_API_URL: then the
#   fast tests run here first, since no Tests run gates it.
# tools/site/build.js stages only what the game loads, with the playtest intake's address from the repository variable
# PLAYTEST_API_URL, if it is set.
name: Deploy to GitHub Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (by hand only; after a push, the Tests workflow has run the whole suite)
        if: github.event_name == 'workflow_dispatch'
        run: npm test
      # The playtest intake's public address (docs/automatic-playtest-collection.md): unset, the site sends nothing
      - run: node tools/site/build.js _site
        env:
          PLAYTEST_API_URL: ${{ vars.PLAYTEST_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # .nojekyll, as before

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer one waits rather than cancelling one in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
